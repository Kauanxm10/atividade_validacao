<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

  <header class="app-header">
    <div class="container header-container">
      <div class="brand">
        <h1>Task Tracker</h1>
        <p class="tagline">Gerenciamento de tarefas e projetos</p>
      </div>
      <button id="btn-tema" class="btn-secondary" aria-label="Alternar tema claro e escuro">
        Alternar Tema
      </button>
    </div>
  </header>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <main id="conteudo-principal" class="container">

    <section class="actions-section">
      <div class="actions-wrapper">
        <h2 id="titulo-lista">Minhas Tarefas</h2>
        <button id="btn-nova-tarefa" class="btn-primary">
          ➕ Nova Tarefa
        </button>
      </div>
    </section>

    <section class="tasks-section" aria-labelledby="titulo-lista">
      <div id="lista-tarefas" class="tasks-grid" role="region" aria-live="polite">
      </div>
    </section>

  </main>

  <div id="modal-tarefa" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-content">
      
      <header class="modal-header">
        <h2 id="modal-titulo">Nova Tarefa</h2>
        <button id="btn-fechar-modal" class="btn-close" aria-label="Fechar janela modal">&times;</button>
      </header>

      <form id="form-tarefa" novalidate>
        <input type="hidden" id="tarefa-id">

        <div class="form-group">
          <label for="input-titulo">Título <span class="required">*</span></label>
          <input type="text" id="input-titulo" required minlength="3" maxlength="100" placeholder="Ex: Entregar relatório de software">
          <span id="erro-titulo" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="input-descricao">Descrição</label>
          <textarea id="input-descricao" rows="3" placeholder="Detalhes opcionais da tarefa..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="select-categoria">Categoria <span class="required">*</span></label>
            <select id="select-categoria" required>
              <option value="Trabalho">Trabalho</option>
              <option value="Estudos">Estudos</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Projetos">Projetos</option>
            </select>
          </div>

          <div class="form-group">
            <label for="select-prioridade">Prioridade <span class="required">*</span></label>
            <select id="select-prioridade" required>
              <option value="Baixa">Baixa</option>
              <option value="Média">Média</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="select-status">Status <span class="required">*</span></label>
            <select id="select-status" required>
              <option value="Pendente">Pendente</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Concluída">Concluída</option>
            </select>
          </div>

          <div class="form-group">
            <label for="input-vencimento">Data de Vencimento</label>
            <input type="date" id="input-vencimento">
          </div>
        </div>

        <footer class="modal-footer">
          <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-salvar" class="btn-primary">Salvar Tarefa</button>
        </footer>

      </form>

    </div>
  </div>

  <footer class="app-footer">
    <div class="container footer-container">
      <p>Desenvolvido para Avaliação Full Stack</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
