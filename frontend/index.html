<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

  <header class="app-header">
    <div class="container header-container">
      <div class="brand">
        <h1>Task Tracker</h1>
        <p class="tagline">Gerenciamento de tarefas e projetos</p>
      </div>
      <nav class="nav-tabs" aria-label="Navegação do aplicativo">
        <button id="tab-tarefas" class="tab-btn active" aria-selected="true" type="button">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Minhas Tarefas</span>
          <span id="badge-count-ativas" class="nav-badge">0</span>
        </button>
        <button id="tab-historico" class="tab-btn" aria-selected="false" type="button">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>Histórico</span>
          <span id="badge-count-concluidas" class="nav-badge">0</span>
        </button>
      </nav>
    </div>
  </header>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <main id="conteudo-principal" class="container">

    <div id="pagina-tarefas" class="page-view">
      <section class="actions-section">
        <div class="actions-wrapper">
          <h2 id="titulo-lista">Minhas Tarefas</h2>
          <button id="btn-nova-tarefa" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Nova Tarefa</span>
          </button>
        </div>
      </section>

      <section class="tasks-section" aria-labelledby="titulo-lista">
        <div id="lista-tarefas" class="tasks-container" role="region" aria-live="polite">
        </div>
      </section>
    </div>

    <div id="pagina-historico" class="page-view hidden">
      <section class="actions-section">
        <div class="actions-wrapper">
          <div>
            <h2 id="titulo-historico">Histórico de Concluídas</h2>
            <p class="tagline">Registro de todas as tarefas finalizadas</p>
          </div>
        </div>
      </section>

      <section class="tasks-section" aria-labelledby="titulo-historico">
        <div id="lista-historico" class="tasks-container" role="region" aria-live="polite">
        </div>
      </section>
    </div>

  </main>

  <div id="modal-tarefa" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-content">

      <header class="modal-header">
        <h2 id="modal-titulo">Nova Tarefa</h2>
        <button id="btn-fechar-modal" class="btn-close" aria-label="Fechar janela modal">&times;</button>
      </header>

      <form id="form-tarefa" novalidate>
        <input type="hidden" id="tarefa-id">

        <div class="form-group">
          <label for="input-titulo">Título <span class="required">*</span></label>
          <input type="text" id="input-titulo" required minlength="3" maxlength="100"
            placeholder="Ex: Entregar relatório de software">
          <span id="erro-titulo" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="input-descricao">Descrição</label>
          <textarea id="input-descricao" rows="3" placeholder="Detalhes opcionais da tarefa..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="select-categoria">Categoria <span class="required">*</span></label>
            <select id="select-categoria" required>
              <option value="Trabalho">Trabalho</option>
              <option value="Estudos">Estudos</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Projetos">Projetos</option>
            </select>
          </div>

          <div class="form-group">
            <label for="select-prioridade">Prioridade <span class="required">*</span></label>
            <select id="select-prioridade" required>
              <option value="Baixa">Baixa</option>
              <option value="Média">Média</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="input-vencimento">Data de Vencimento</label>
          <input type="date" id="input-vencimento">
          <span id="erro-vencimento" class="error-message" aria-live="polite"></span>
        </div>

        <footer class="modal-footer">
          <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-salvar" class="btn-primary">Salvar Tarefa</button>
        </footer>

      </form>

    </div>
  </div>

  <footer class="app-footer">
    <div class="container footer-container">
      <p>Desenvolvido por Kauan Xavier</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
